name: propcid_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+11

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  # Renders the portal's lucide-react icons verbatim (assets/lucide).
  flutter_svg: ^2.0.10
  provider: ^6.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  photo_view: ^0.15.0
  url_launcher: ^6.2.0
  lottie: ^3.0.0
  confetti: ^0.7.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  # Project brochures are PDFs and `image_picker` cannot select one. The builder
  # project wizard's step 2 requires `brochure_url`
  # (propcid/src/lib/validation/projectRules.ts mediaRules), so a document picker
  # is the only way to satisfy a mandatory field. Approved as decision D3 of
  # docs/BUILDER_FLOW_IMPLEMENTATION_PLAN.md.
  file_picker: ^8.1.7
  supabase_flutter: ^2.12.4
  # The `https://propcid.com/accept-invite` team-invite link — the only deep
  # link this app resolves without a custom scheme, so unlike the OAuth/
  # password-reset ones (handled entirely by supabase_flutter's own redirect
  # plumbing) this needs a generic URI listener.
  app_links: ^6.3.2
  flutter_secure_storage: ^9.1.2
  flutter_dotenv: ^6.0.1
  video_player: ^2.9.2
  # The influencer video upload has to fit the `property-media` bucket's 50 MB
  # file_size_limit (20260522105737_fix_audit_issues.sql:18), and a phone clip
  # rarely does untouched. The portal downscales to 1080p/30fps client-side before
  # uploading (InfluencerVideoModal.tsx:132-133 via utils/videoCompression);
  # `image_picker` has no video equivalent of maxWidth/imageQuality, so this is the
  # only way to match that step. Approved as decision E1.
  video_compress: ^3.1.4
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  # Razorpay's native checkout sheet. The web portal loads checkout.js in a
  # browser (`PaymentContext.tsx:142-157`); a Flutter app needs the native SDK,
  # which is the one part of the payment flow that cannot be shared with the
  # portal. Order creation and verification still go through the same deployed
  # Edge Functions.
  razorpay_flutter: ^1.4.0
  http: ^1.2.1
  # Push notifications. Firebase is initialised from android/app/google-services.json
  # (and ios/Runner/GoogleService-Info.plist); PushNotificationService degrades to a
  # no-op when that file is absent so builds without it keep working.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  http_parser: ^4.0.2
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  audioplayers: ^6.1.0
  flutter_sound: ^9.16.1
  path_provider: ^2.1.4
  # Runtime mic-permission request/status for voice notes (granted/denied/
  # permanently-denied) — the existing AndroidManifest RECORD_AUDIO
  # declaration alone doesn't drive the in-app runtime prompt or let us
  # distinguish "denied" from "permanently denied, needs Settings".
  permission_handler: ^11.3.1
  # Saves the generated Digital Visiting Card PNG to the device gallery for
  # the profile-share "Download PNG" action — the mobile equivalent of the
  # portal's browser download. No existing dependency covers gallery writes.
  gal: ^2.3.1
  # Pure-Dart re-encode of a picked chat photo strips EXIF/GPS before upload,
  # matching the portal's client-side `stripImageMetadata` in
  # features/messaging/lib/uploadChatMedia.ts — chat-media is a private
  # bucket read only via signed URL, but the file itself shouldn't carry the
  # sender's location data regardless.
  image: ^4.3.0
  # Explicit dependency for chat-media upload paths (${authUid}/${uuid}.ext) —
  # was only reachable transitively via supabase_flutter before.
  uuid: ^4.5.3
  flutter_quill: ^11.5.1
  flutter_quill_extensions: ^11.0.0
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  # Reads this file's own `version:` line (and build number) at runtime, so the
  # About dialog always matches what was actually shipped in the AAB instead of
  # a hand-typed string that goes stale on the next release. Already resolved
  # transitively (via supabase_flutter) at 9.0.1 — this only promotes it to a
  # direct dependency, it does not add a new package to the tree.
  package_info_plus: ^9.0.1
  font_awesome_flutter: ^11.0.0
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  # Full-bleed square (no baked-in rounded corners/border): iOS and the
  # launcher apply their own mask. Master artwork: assets/branding/APP_ICON.png.
  image_path: "assets/branding/appp_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Android 8+ adaptive icon. The foreground is full-bleed (inset 0) with the
  # logo kept inside the 66dp safe zone, so circle/squircle/teardrop masks
  # never clip it; the monochrome layer drives Android 13+ themed icons.
  adaptive_icon_foreground: "assets/branding/app_icon_adaptive_foreground.png"
  adaptive_icon_background: "assets/branding/app_icon_adaptive_background.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_adaptive_monochrome.png"
  adaptive_icon_foreground_inset: 0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/formicons/
    - assets/lucide/
    - assets/categoriesicons/
    - assets/branding/propcid_logo.png
    - assets/Onboarding/
    - assets/searchpage/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
